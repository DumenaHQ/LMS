<div class="modal">
    <div class="modal_area">
      <span class="modal_area_close" (click)="closeAddAdminModal()">
        <i class="bx bx-x icon clickable"></i>
      </span>
  
      <div class="enroll auth_content">
        <h4 class="text-primary-color enroll_title">Add Admin</h4>
        <form [formGroup]="formGroup">
          <div class="form_control_container">
            <div class="form_control">
              <label for="firstName">First Name <strong class="label-required">*</strong></label>
              <div class="form_control_field">
                <input
                  type="text"
                  id="firstName"
                  name="firstName"
                  placeholder=""
                  formControlName="firstName"
                />
              </div>
              <div class="form_error" *ngIf="formGroup.controls.firstName.errors && formGroup.controls.firstName.touched">
                <p class="body-3-regular error-msg">{{ getErrorMessage('firstName', 'First Name') }}</p>
              </div>
            </div>
      
            <div class="form_control">
              <label for="lastName">Last Name <strong class="label-required">*</strong></label>
              <div class="form_control_field">
                <input
                  type="text"
                  id="lastName"
                  name="lastName"
                  placeholder=""
                  formControlName="lastName"
                />
              </div>
              <div class="form_error" *ngIf="formGroup.controls.lastName.errors && formGroup.controls.lastName.touched">
                <p class="body-3-regular error-msg">{{ getErrorMessage('lastName', 'Last Name') }}</p>
              </div>
            </div>
      
            <div class="form_control col-2">
              <label for="email">Email <strong class="label-required">*</strong></label>
              <div class="form_control_field">
                <input
                  type="text"
                  id="email"
                  name="email"
                  placeholder=""
                  formControlName="email"
                />
              </div>
      
              <div class="form_error" *ngIf="formGroup.controls.email.errors && formGroup.controls.email.touched">
                <p class="body-3-regular error-msg">{{ getErrorMessage('email', 'Email') }}</p>
              </div>
            </div>

            <div class="form_control">
                <label for="phoneNumber">Phone Number <strong class="label-required">*</strong></label>
                <div class="form_control_field">
                  <input
                    type="text"
                    id="phoneNumber"
                    name="phoneNumber"
                    placeholder=""
                    formControlName="phoneNumber"
                  />
                </div>
                <div class="form_error" *ngIf="formGroup.controls.phoneNumber.errors && formGroup.controls.phoneNumber.touched">
                  <p class="body-3-regular error-msg">{{ getErrorMessage('phoneNumber', 'Phone Number') }}</p>
                </div>
            </div>

            <div class="form_control">
                <label for="role">Role Type <strong class="label-required">*</strong></label>
                <div class="form_control_field">
                  <select name="role" id="role" formControlName="role">
                    <option value="">Select an option</option>
                    <option value="admin">Admin</option>
                    <option value="educator">Educator</option>
                  </select>
                </div>
                <div class="form_error" *ngIf="formGroup.controls.role.errors && formGroup.controls.role.touched">
                  <p class="body-3-regular error-msg">{{ getErrorMessage('role', 'Role') }}</p>
                </div>
            </div>
          </div>
      
          <div class="form_btns dis-flex">
            <ng-container *ngIf="!loading">
              <button class="btn grey_btn" (click)="closeAddAdminModal()">
                Cancel
              </button>
              <button class="btn prim_btn" (click)="createAdmin()" [disabled]="formGroup.invalid">Save</button>
            </ng-container>
            <button class="btn prim_btn" [disabled]="loading" *ngIf="loading">
              Processing...
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
