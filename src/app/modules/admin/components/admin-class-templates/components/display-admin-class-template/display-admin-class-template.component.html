<section class="ds-head">
    <h2 class="ds-head_title">Class Templates</h2>
  </section>
    
  <app-loader *ngIf="dataLoading"></app-loader>
  
  <ng-container *ngIf="classTemplates?.length >= 1">
      <section class="grouping dis-flex">
        <!-- Filter -->
        <div class="filter s-f">
          <div class="body-3-regular dis-flex">
            <span class="title">Filter:</span>
            <span class="dropdown dis-flex clickable"
              >All class Templates <i class="bx bx-chevron-down"></i
            ></span>
          </div>
        </div>
      
        <div class="right dis-flex">
          <!-- Sort -->
          <div class="sort s-f">
            <div class="body-3-regular dis-flex">
              <span class="title">Sort:</span>
              <span class="dropdown dis-flex clickable"
                >Last modified <i class="bx bx-chevron-down"></i
              ></span>
            </div>
          </div>
      
          <!-- New Program Button -->
          <button class="btn prim_btn" routerLink="add-class-template">
            New Class Template
          </button>
        </div>
      </section>
      
      <section class="classroom">
        <app-grid-display-admin-class-template [classTemplates]="classTemplates"></app-grid-display-admin-class-template>
      </section>
  </ng-container>
  
  <!-- Classroom Blank -->
  <section class="classroom" *ngIf="classTemplates?.length === 0">
    <div class="classroom_body">
        <app-blank-display-admin-class-template></app-blank-display-admin-class-template>
    </div>
  </section>
