<!-- Alert message -->
<app-alert-popup
  *ngIf="isAlert"
  [alertMessage]="alertMessage"
  [alertColor]="alertColor"
></app-alert-popup>

<section class="ds-head dis-flex">
    <h2 class="ds-head_title clickable" routerLink="/admin/quizzes">Quizzes</h2>
    <i class="bx bx-chevron-right icon"></i>
    <p class="clickable">
      Add Quiz
    </p>
</section>

<section class="set-info">
    <div class="set-info_header">
      <h3 class="text-primary-color">Set the Quiz Information</h3>
      <p>
        This information will be displayed to the learners before they take the
        quiz
      </p>
    </div>
    <form [formGroup]="quizForm">
        <div class="form_control_container">
            <div class="form_control">
              <label for="title">Quiz Title <strong class="label-required">*</strong></label>
              <div class="form_control_field">
                <input type="text" id="title" name="title" placeholder="Type here" formControlName="title" />
              </div>
            </div>
            <div class="form_control tags">
              <label for="tags">Tags</label>
              <div class="form_control_field dis-flex">
                  <input
                    type="text"
                    name="tags"
                    id="tags"
                    placeholder="Type here"
                    formControlName="tags"
                  >
                  <button class="btn prim_btn" (click)="addTag()">Add</button>
                </div>
                <div class="tag_list dis-flex">
                  <div
                    class="tag_list_item dis-flex"
                    *ngFor="let tag of tagsList; let tagIndex = index"
                  >
                    <small [title]="tag">{{
                      tag.length > 12 ? tag.slice(0, 10) + "..." : tag
                    }}</small>
                    <i
                      class="bx bx-x icon clickable"
                      (click)="removeTag(tagIndex)"
                    ></i>
                  </div>
                </div>
            </div>
            <div class="form_setting">
              <div class="">
                <h3 class="text-primary-color">Quiz Settings</h3>
                <p>Configure your quiz settings</p>
              </div>
              <label class="">
                <input type="checkbox" id="settings" name="settings" formControlName="settings"/>
                Show the correct answer
              </label>
            </div>
        </div>

        <div class="form_btns dis-flex">
            <ng-container *ngIf="!loading">
              <button class="btn grey_btn" routerLink="/admin/quizzes">Cancel</button>
              <button class="btn prim_btn" (click)="addQuiz()" [disabled]="quizForm.invalid">Create</button>
            </ng-container>
            <button
              class="btn prim_btn"
              [disabled]="loading"
              *ngIf="loading"
            >Processing...</button> 
          </div>
    </form>
  </section>
