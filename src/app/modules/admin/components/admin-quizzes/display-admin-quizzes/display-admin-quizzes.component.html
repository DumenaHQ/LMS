<section class="ds-head">
    <h2 class="ds-head_title">Quizzes</h2>
</section>

<section class="grouping dis-flex">
    <!-- Filter -->
    <div class="filter s-f">
        <div class="body-3-regular dis-flex">
            <span class="title">Filter:</span>
            <span class="dropdown dis-flex clickable"
            >All Quizzes <i class="bx bx-chevron-down"></i
            ></span>
        </div>
    </div>

    <div class="right dis-flex">
        <!-- Sort -->
        <div class="sort s-f">
            <div class="body-3-regular dis-flex">
            <span class="title">Sort:</span>
            <span class="dropdown dis-flex clickable"
                >Last modified <i class="bx bx-chevron-down"></i
            ></span>
            </div>
        </div>
    </div>
</section>

<ng-container>
    <app-loader *ngIf="dataLoading"></app-loader>
    
    <section class="courses" *ngIf="allquizzes?.length > 0">  
        <app-list-display-admin-quizzes [allquizzes]="allquizzes"></app-list-display-admin-quizzes>
        <div class="courses_body" *ngIf="allquizzes?.length === 0">
            <app-blank-display-admin-quiz></app-blank-display-admin-quiz>
        </div>
    </section>
</ng-container>
