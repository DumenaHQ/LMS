<!-- Alert message -->
<app-alert-popup
  *ngIf="isAlert"
  [alertMessage]="alertMessage"
  [alertColor]="alertColor"
></app-alert-popup>

<section class="ds-head dis-flex">
  <h2 class="ds-head_title clickable" routerLink="/admin/programs">Programs</h2>
  <i class="bx bx-chevron-right icon"></i>
  <p>
    Add Program
  </p>
</section>


<section class="set-info">
  <div class="set-info_header">
    <h3 class="text-primary-color">Set the Program Information</h3>
    <p>
      This information will be displayed to the learners before they join the
      program
    </p>
  </div>
  <form [formGroup]="programForm">
    <div class="form_control_container">
      <div class="form_control">
        <label for="name">Program Title</label>
        <div class="form_control_field">
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Type here"
            formControlName="name"
          />
        </div>
      </div>
      <div class="form_control description">
        <label for="description">Description</label>
        <div class="form_control_field">
          <textarea
            name="description"
            id="description"
            cols="30"
            rows="5"
            placeholder="Type here"
            spellcheck="true"
            formControlName="description"
          ></textarea>
        </div>
      </div>
      <div class="form_control">
        <label for="thumbnail">Thumbnail</label>
        <div class="">
          <div
            class="form_control_field select-image clickable"
            (click)="fileThumbnail.click()"
            appDragDrop
            (fileDropped)="uploadThumbnail($event)"
          >
            <input
              type="file"
              #fileThumbnail
              hidden
              (change)="uploadThumbnail($event)"
            />
            <img
              src="../../../../../../../assets/img/select-Image.svg"
              alt=""
            />
            <p class="body-3-regular text-primary-color">
              {{ selectedThumbnailName === '' ? 'Select a picture' : selectedThumbnailName }}
            </p>
          </div>
        </div>
      </div>
      <div class="form_control">
        <label for="thumbnail">Header Photo</label>
        <div class="">
          <div
            class="form_control_field select-image clickable"
            (click)="fileHeaderPhoto.click()"
            appDragDrop
            (fileDropped)="uploadHeaderPhoto($event)"
          >
            <input
              type="file"
              #fileHeaderPhoto
              hidden
              (change)="uploadHeaderPhoto($event)"
            />
            <img
              src="../../../../../../../assets/img/select-Image.svg"
              alt=""
            />
            <p class="body-3-regular text-primary-color">
              {{ selectedHeaderPhotoName === '' ? 'Select a picture' : selectedHeaderPhotoName }}
            </p>
          </div>
        </div>
      </div>
    </div>
    <div class="form_btns">
      <button class="btn prim_btn" (click)="createProgram()">Save</button>
    </div>
  </form>
</section>
