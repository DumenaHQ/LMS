<!-- Alert message -->
<app-alert-popup
  *ngIf="isAlert"
  [alertMessage]="alertMessage"
  [alertColor]="alertColor"
></app-alert-popup>


<section class="set-info" app>
  <div class="set-info_header">
    <h3 class="text-primary-color">Set the Program Information</h3>
    <p>
      This information will be displayed to the learners before they join the
      program
    </p>
  </div>
  <button class="btn prim_btn" (click)="createProgram()">Save</button>
  <form [formGroup]="programForm">
    <div class="form_control">
      <label for="name">Program Title</label>
      <div class="form_control_field">
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Type here"
          formControlName="name"
        />
      </div>
    </div>
    <div class="form_control description">
      <label for="description">Program Details</label>
      <div class="form_control_field">
        <textarea
          name="description"
          id="description"
          cols="30"
          rows="5"
          placeholder="Type here"
          spellcheck="true"
          formControlName="description"
        ></textarea>
      </div>
    </div>
    <div class="form_setting">
      <div class="">
        <h3 class="text-primary-color">Program Timeframe</h3>
        <p>Confugure the start and end date of the program</p>
      </div>
      <div class="set-date-area">
        <label for="start_date" class="date start_date">
          <input
            type="date"
            id="start_date"
            name="start_date"
            formControlName="start_date"
          />
        </label>
        <i class="bx bx-minus icon"></i>
        <label for="end_date" class="date end_date">
          <input
            type="date"
            id="end_date"
            name="end_date"
            formControlName="end_date"
          />
        </label>
      </div>
    </div>
  </form>
</section>
