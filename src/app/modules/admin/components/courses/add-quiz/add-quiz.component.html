<div class="modal">
  <div class="modal_area">
    <span class="modal_area_close" (click)="closeAddQuizToCourse()">
      <i class="bx bx-x icon clickable"></i>
    </span>

    <div class="enroll auth_content">
      <h4 class="text-primary-color enroll_title">Add Quiz to Lesson</h4>
      
      <form class="enroll_form auth_content_form" [formGroup]="formGroup">
        <div class="form_control">
          <label for="title">Title <strong class="label-required">*</strong></label>
          <div class="form_control_field">
            <input 
              type="text" 
              id="title" 
              name="title" 
              placeholder="Type here" 
              formControlName="title" 
            />
          </div>
          <div class="form_error">
            <div *ngIf="formGroup.controls['title'].invalid && formGroup.controls['title'].touched">
              Title is required.
            </div>
          </div>
        </div>
        <div class="form_control">
          <label for="tags">Tags</label>
          <div class="form_control_field dis-flex">
              <input
                type="text"
                name="tags"
                id="tags"
                placeholder="Type here"
                formControlName="tags"
              >
              <button class="btn prim_btn" (click)="addTag()">Add</button>
            </div>
            <div class="tag_list dis-flex">
              <div class="tag_list_item dis-flex" *ngFor="let tag of tags; let tagIndex = index">
                <small [title]="tag">{{ tag | truncate: 12 }}</small>
                <i class="bx bx-x icon clickable"(click)="removeTag(tagIndex)"></i>
              </div>
            </div>
        </div>

        <div class="form_setting">
          <div class="">
            <h4 class="text-primary-color">Quiz Settings</h4>
            <p><i>Configure your quiz settings</i></p>
          </div>
          <label class="">
            <input type="checkbox" id="settings" name="settings" formControlName="settings"/>
            Show the correct answer
          </label>
        </div>
      </form>

      <div class="form-btns dis-flex">
        <span
          class="grey_btn clickable"
          (click)="closeAddQuizToCourse()"
          >Cancel</span
        >
        <div class="continue">
          <button
            class="btn prim_btn clickable"
            [disabled]="loading || formGroup.invalid"
            (click)="addQuizToCourse()"
          >
            <span *ngIf="!loading">Add</span>
            <span *ngIf="loading">Processing...</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
