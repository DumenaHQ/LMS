<!-- Alert message -->
<app-alert-popup
  *ngIf="isAlert"
  [alertMessage]="alertMessage"
  [alertColor]="alertColor"
></app-alert-popup>

<section class="set-info" app>
  <div class="set-info_header">
    <h3 class="text-primary-color">Course Module</h3>
    <!-- <p>
      This information will be displayed to the learners before they start the
      course
    </p> -->
    <!-- <button class="btn prim_btn" (click)="addLesson()">Save</button> -->
  </div>
  <!-- <div class="modules">
    <div class="module_list dis-flex">
      <div class="module_list_item" *ngFor="let module of modules">
        <h5>{{module.title}}</h5>
        <button class="btn sec_btn">Selet</button>
      </div>
    </div>
  </div> -->
  <!-- Module Form -->
  <form [formGroup]="moduleForm" style="margin-bottom: 3rem;">
    <div class="form_control">
      <label for="title">Module Title</label>
      <div class="form_control_field">
        <input
        type="text"
          id="title"
          placeholder="Type here"
          formControlName="title"
        />
      </div>
    </div>
    <div class="form_control"></div>
    <div class="form_btns">
      <button class="btn prim_btn" (click)="addModule()">Save</button>
    </div>
  </form>
  <!-- Lesson Form -->
  <form [formGroup]="lessonForm">
    <div class="form_control">
      <label for="lesson_video">Lesson Video</label>
      <div class="">
        <div
          class="form_control_field select-image clickable"
          (click)="fileInput.click()"
          appDragDrop
          (fileDropped)="uploadFile($event)"
        >
          <input
            type="file"
            id="lesson_video"
            #fileInput
            hidden
            (change)="uploadFile($any($event).target.files)"
          />
          <img
            [src]="
              showPreviewImage
                ? previewImage
                : '../../../assets/img/select-Image.svg'
            "
            alt=""
          />
          <p class="body-3-regular">
            Drag your image here or
            <span class="text-primary-color">browse</span>
          </p>
          <p class="body-3-regular">Max file size 4MB</p>
        </div>
      </div>
    </div>
    <div class="form_control">
      <label for="title">Lesson Title</label>
      <div class="form_control_field">
        <input
        type="text"
          id="title"
          placeholder="Type here"
          formControlName="title"
        />
      </div>
    </div>
    <div class="form_control">
      <label for="further_reading">Further Reading</label>
      <div class="form_control_field">
        <textarea
          name=""
          id="further_reading"
          cols="30"
          rows="5"
          placeholder="Type here"
          spellcheck="true"
          formControlName="further_reading"
          ></textarea>
      </div>
    </div>
    <div class="form_control">
      <label for="class_activity">Class Activity</label>
      <div class="form_control_field">
        <textarea
        name=""
        id="class_activity"
        cols="30"
        rows="8"
        placeholder="Type here"
        spellcheck="true"
        formControlName="class_activity"
        ></textarea>
      </div>
    </div>
    <div class="form_control code_example">
      <label for="code_example">Code Example</label>
      <div class="form_control_field">
        <textarea
          name=""
          id="code_example"
          cols="30"
          rows="8"
          placeholder="Type here"
          spellcheck="true"
          formControlName="code_example"
        ></textarea>
      </div>
    </div>
    <div class="form_btns">
      <button class="btn prim_btn" (click)="addLesson()">Save</button>
    </div>
  </form>
</section>
