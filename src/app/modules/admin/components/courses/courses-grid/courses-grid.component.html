<div class="courses_disgrid">
  <div class="card">
    <div
      class="card_item clickable"
      *ngFor="let i of allCourses"
      [routerLink]="i.id"
      [title]="i.name"
    >
      <img [src]="i.thumbnail" alt="" class="card_item_image" />
      <div class="content">
        <div class="content_details">
          <div class="content_details_header dis-flex">
            <h5>{{ i.name.slice(0, 22) }}...</h5>
            <div class="actions">
              <img src="../../../assets/img/action.svg" alt="" />
            </div>
          </div>
          <div class="icons dis-flex">
            <span class="dis-flex"
              ><img src="../../../assets/img/library/Bag.svg" alt="" />
              <p class="body-3-regular">{{ i.quadrant }}</p></span
            >
            <span class="dis-flex"
              ><img src="../../../assets/img/library/video-square.svg" alt="" />
              <p class="body-3-regular">{{ i.lessonNumber }} Lessons</p></span
            >
            <span class="dis-flex"
              ><img src="../../../assets/img/library/clock.svg" alt="" />
              <p class="body-3-regular">{{ i.duration }}</p></span
            >
          </div>
          <!-- Status -->
          <span [ngClass]="i.status ? 'success_btn' : 'grey_btn'">{{
            i.status ? "Published" : "Draft"
          }}</span>
        </div>
      </div>
      <div class="card_item_footer">
        <div class="card_item_footer_rates">
          <div class="card_item_footer_rates_item">
            <p class="body-3-regular title">Completion rate</p>
            <p class="body-3-medium value">85%</p>
          </div>
          <div class="card_item_footer_rates_item">
            <p class="body-3-regular title">Ratings</p>
            <p class="body-3-medium value">4.5 stars</p>
          </div>
        </div>
        <div class="card_item_footer_no-stats">
          <span class="dis-flex">
            <img src="../../../assets/img/chart.svg" alt="" />
            <p class="body-3-medium">This course has no stats yet</p>
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
