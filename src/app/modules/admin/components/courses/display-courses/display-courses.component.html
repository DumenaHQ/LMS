<section class="ds-head">
  <h2 class="ds-head_title">Courses</h2>
</section>
  
  <section class="grouping dis-flex">
    <!-- Filter -->
    <div class="filter s-f">
      <div class="body-3-regular dis-flex">
        <span class="title">Filter:</span>
        <span class="dropdown dis-flex clickable"
          >All Courses <i class="bx bx-chevron-down"></i
        ></span>
      </div>
    </div>
  
    <div class="right dis-flex">
      <!-- Sort -->
      <div class="sort s-f">
        <div class="body-3-regular dis-flex">
          <span class="title">Sort:</span>
          <span class="dropdown dis-flex clickable"
            >Last modified <i class="bx bx-chevron-down"></i
          ></span>
        </div>
      </div>
      <!-- Display type -->
      <div class="display-type">
        <span (click)="setDisplayType('grid')">
          <img
            src="../../../assets/img/grid.svg"
            alt=""
            [class.active]="displayType === 'grid'"
          />
        </span>
        <span (click)="setDisplayType('list')">
          <img
            src="../../../assets/img/list.svg"
            alt=""
            [class.active]="displayType === 'list'"
          />
        </span>
      </div>
      
      <button class="btn prim_btn" routerLink="add-course">New Course</button>
    </div>
  </section>
  
  <section class="courses">
    <div class="courses_body">
      <app-loader *ngIf="dataLoading"></app-loader>
      <ng-container *ngIf="courses?.length > 0">
        <app-courses-list
          *ngIf="displayType === 'list'"
          [courses]="courses"
        ></app-courses-list>

        <app-courses-grid
          *ngIf="displayType === 'grid'"
          [courses]="courses"
        ></app-courses-grid>
      </ng-container>

      <app-courses-blank *ngIf="courses?.length == 0"></app-courses-blank>
    </div>
  </section>
