<section class="ds-head">
    <h2 class="ds-head_title">Programs</h2>
</section>
    
<section class="grouping dis-flex">
    <!-- Filter -->
    <div class="filter s-f">
        <div class="body-3-regular dis-flex">
        <span class="title">Filter:</span>
        <span class="dropdown dis-flex clickable"
            >All programs <i class="bx bx-chevron-down"></i
        ></span>
        </div>
    </div>

    <div class="right dis-flex">
        <!-- Sort -->
        <div class="sort s-f">
        <div class="body-3-regular dis-flex">
            <span class="title">Sort:</span>
            <span class="dropdown dis-flex clickable"
            >Last modified <i class="bx bx-chevron-down"></i
            ></span>
        </div>
        </div>

        <button class="btn prim_btn" (click)="goToAddProgram()" *ngIf="user.role === 'admin'">
            New Program
        </button>
    </div>
</section>

<ng-container>
    <app-loader *ngIf="dataLoading"></app-loader>

    <section class="classroom" *ngIf="!dataLoading">
        <app-grid-display-programs [programs]="programs" [user]="user" *ngIf="programs?.length ?? 0 > 0" (reloadData)="getPrograms()"></app-grid-display-programs>

        <div class="classroom_body" *ngIf="programs?.length === 0">
            <app-blank-display-program [user]="user"></app-blank-display-program>
        </div>
    </section>
</ng-container>
