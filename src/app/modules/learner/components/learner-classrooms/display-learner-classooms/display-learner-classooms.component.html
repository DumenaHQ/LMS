<section class="ds-head">
    <h2 class="ds-head_title">Classrooms</h2>
  </section>
    
  <app-loader *ngIf="dataLoading"></app-loader>
  
  <ng-container *ngIf="classrooms?.length >= 1">
      <section class="grouping dis-flex">
        <!-- Filter -->
        <div class="filter s-f">
          <div class="body-3-regular dis-flex">
            <span class="title">Filter:</span>
            <span class="dropdown dis-flex clickable"
              >All classrooms <i class="bx bx-chevron-down"></i
            ></span>
          </div>
        </div>
      
        <div class="right dis-flex">
          <!-- Sort -->
          <div class="sort s-f">
            <div class="body-3-regular dis-flex">
              <span class="title">Sort:</span>
              <span class="dropdown dis-flex clickable"
                >Last modified <i class="bx bx-chevron-down"></i
              ></span>
            </div>
          </div>
        </div>
      </section>
      
      <section class="classroom">
        <app-grid-display-learner-classrooms [classrooms]="classrooms"></app-grid-display-learner-classrooms>
      </section>
  </ng-container>
  
  <!-- Classroom Blank -->
  <section class="classroom" *ngIf="classrooms?.length === 0">
    <div class="classroom_body">
        <app-blank-display-learner-classroom></app-blank-display-learner-classroom>
    </div>
  </section>
