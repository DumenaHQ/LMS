<div class="card">
  <div
    class="card_item clickable"
    *ngFor="let i of courses"
    routerLink="/learner/course-info"
  >
    <picture>
      <img [src]="i.image" alt="" />
    </picture>
    <div class="details">
      <h4 class="title">{{ i.title }}</h4>
      <div class="icons">
        <span class="dis-flex"
          ><img src="../../../assets/img/library/Bag.svg" alt="" />
          <p>{{ i.level }}</p></span
        >
        <span class="dis-flex"
          ><img src="../../../assets/img/library/video-square.svg" alt="" />
          <p>{{ i.lessonNumber }}</p></span
        >
        <span class="dis-flex"
          ><img src="../../../assets/img/library/clock.svg" alt="" />
          <p>{{ i.duration }}</p></span
        >
      </div>
    </div>
  </div>
</div>
