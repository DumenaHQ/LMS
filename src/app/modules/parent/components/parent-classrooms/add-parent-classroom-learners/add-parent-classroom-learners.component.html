<!-- Alert message -->
<app-alert-popup
  *ngIf="isAlert"
  [alertMessage]="alertMessage"
  [alertColor]="alertColor"
></app-alert-popup>

<!-- School -->
<ng-container>
    <div class="modal">
      <div class="modal_area" [class.remove-padd]="billingId == 'single'">
        <span class="modal_area_close" (click)="closeAddLearnerToClassroomModal()">
          <i class="bx bx-x icon clickable"></i>
        </span>
    
        <div class="enroll auth_content">
          <h4
            class="text-primary-color enroll_title"
            [class.add-padd]="billingId == 'single'"
          >
            Add Learner(s) to this Classroom
          </h4>
          <form
            class="enroll_form auth_content_form"
          >
            <!-- Tabs starts -->
            <div class="form-field col-2" [class.add-padd]="billingId == 'single'">
              <label for="">Select an enrollment method</label>
              <!-- enroll-mtd tabs -->
              <div class="enroll-mtd_tab">
                <div class="enroll-mtd_tab_wrapper">
                  <span
                    class="tab"
                    [class.active]="billingId == 'single'"
                    (click)="tabChange('single')"
                    >Select Learner(s)
                  </span>
                  <span
                    class="tab"
                    [class.active]="billingId == 'batch'"
                    (click)="tabChange('batch')"
                    >Upload learner
                  </span>
                </div>
              </div>
            </div>
            <!-- Tabs starts -->
    
            <!-- Single enrollment starts *ngIf="billingId == 'single'" -->
            <div class="col-2" *ngIf="billingId == 'single'">
              <div class="table-container">
                <div class="table-container_header dis-flex">
                  <div class="input_field dis-flex">
                    <img
                      src="../../../../../../assets/img/svg/Search.svg"
                      alt="image"
                    />
                    <input type="text" placeholder="Search by Name" name="search" [(ngModel)]="studentName"
                    (input)="search()" />
                  </div>
    
                  <div class="grouping dis-flex">
                    <!-- Filter -->
                    <div class="filter s-f">
                      <div class="captions-regular dis-flex">
                        <span class="title">Filter:</span>
                        <span class="dropdown-btn dis-flex clickable"
                          >Grade <i class="bx bx-chevron-down"></i
                        ></span>
                      </div>
                    </div>
                    <!-- Sort -->
                    <div class="sort s-f">
                      <div class="captions-regular dis-flex">
                        <span class="title">Sort:</span>
                        <span class="dropdown-btn dis-flex clickable"
                          >Name <i class="bx bx-chevron-down"></i
                        ></span>
                      </div>
                    </div>
                  </div>
                </div>
                <div style="overflow: auto; max-height: 300px;">
                  <app-loader *ngIf="dataLoading"></app-loader>
                  <table *ngIf="schoolLearners?.length > 0">
                    <tr class="table-header">
                      <th>Student name</th>
                      <th>Username</th>
                      <th>Grade</th>
                      <th class="dis-flex actions">
                        <!-- Mark all <input type="checkbox" name="" id="" /> -->
                      </th>
                    </tr>
                    <tr class="table-body" *ngFor="let student of schoolLearners">
                      <td>{{student.fullname}}</td>
                      <td>{{student.username}}</td>
                      <td>{{student.grade}}</td>
                      <td><input type="checkbox" name="student" [id]="student.id" (change)="selectStudent($event, student)" /></td>
                    </tr>
                  </table>
                  <ng-container *ngIf="schoolLearners?.length === 0">
                    <p style="text-align: center">No learner!</p>
                  </ng-container>
                </div>
              </div>
    
              <!-- Submit Button -->
              <div class="form-btns dis-flex">
                <span
                  class="grey_btn clickable"
                  (click)="closeAddLearnerToClassroomModal()"
                  >Cancel</span
                >
                <div class="continue">
                  <button
                    class="btn prim_btn clickable"
                    [disabled]="loading"
                    (click)="addLearnersToClassroom()"
                  >
                    <span *ngIf="!loading">Add</span>
                    <span *ngIf="loading">Processing...</span>
                  </button>
                </div>
              </div>
            </div>
            <!-- Single enrollment ends -->
    
            <!-- Batch enrollment starts *ngIf="billingId == 'batch'" -->
            <div class="batch-enroll col-2" *ngIf="billingId == 'batch'">
              <div class="form-field col-2">
                <label for=""
                  >Upload an excel sheet containing the <b>Username</b> Or download
                  an excel template
                  <strong 
                    ><a [href]="'https://dev.dumena.com/schools/' + user.id + '/download-students-list'" class="text-primary-color hover-1 clicakble">here</a></strong
                  ></label
                >
                <div
                  class="form-field select-image clickable"
                  (click)="fileInput.click()"
                  appDragDrop
                  (fileDropped)="uploadFile($event)"
                >
                  <input
                    type="file"
                    #fileInput
                    hidden
                    accept=".xlsx"
                    (change)="uploadFile($event)"
                  />
                  <p>{{ selectedFileName }}</p>
                  <p class="body-3-regular">
                    Select your file here 
                    <!--or <span class="text-primary-color">browse</span> -->
                  </p>
                  <p class="body-3-regular">Max file size 4MB</p>
                </div>
              </div>
              <!-- Submit Button -->
              <div class="form-btns col-2 dis-flex">
                <span
                  class="grey_btn clickable"
                  (click)="closeAddLearnerToClassroomModal()"
                  >Cancel</span
                >
                <div class="continue">
                  <button
                    class="btn prim_btn clickable"
                    [disabled]="loading || learnersList === undefined"
                    (click)="batchAddLearnersToClassroom()"
                  >
                    <span *ngIf="!loading">Continue</span>
                    <span *ngIf="loading">Processing...</span>
                  </button>
                </div>
              </div>
            </div>
            <!-- Batch enrollment ends -->
          </form>
        </div>
      </div>
    </div>
</ng-container>
