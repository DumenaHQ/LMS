<section class="ds-head">
  <h2 class="ds-head_title">Children</h2>
</section>

<section class="children">
  <div class="children_body">
    <!-- Loader -->
    <app-loader *ngIf="dataLoading"></app-loader>

    <ng-container *ngIf="children?.length > 0">
      <div class="card">
        <div class="card_item clickable" *ngFor="let i of children">
          <img [src]="i.avatar" alt="" class="avatar" />
          <h4 class="name">{{ i.fullname }}</h4>
          <button class="btn prim_btn" (click)="manageChild(i.id)">
            Manage Child
          </button>
          <p
            class="body-2-medium text-secondary-color select-plan hover-2"
            (click)="openSelectPlanModal(i)"
          >
            Select learning plan
          </p>
        </div>
        <!-- Add New Child -->
        <div class="card_item clickable" (click)="openAddModal()">
          <span class="add-icon">
            <i class="bx bx-plus"></i>
          </span>
          <button class="btn tert_btn">Add Child</button>
        </div>
      </div>
    </ng-container>

    <!-- Course Blank -->
    <ng-container *ngIf="children?.length == 0">
      <app-children-blank (addModal)="openAddModal()"></app-children-blank>
    </ng-container>
  </div>
</section>

<!-- Enrol Learner -->
<app-enroll-learner
  *ngIf="addModal"
  (addModal)="closeAddModal()"
  (isAlert)="showAlert()"
  (alertMessaage)="setAlertMessage($event)"
  [title]="title"
></app-enroll-learner>

<!-- Pricing plan -->
<app-pricing-plan
  *ngIf="selectPlanModal"
  (selectPlanModal)="closeSelectPlanModal()"
  [childData]="childData"
  (isAlert)="showAlert()"
  (alertMessaage)="setAlertMessage($event)"
></app-pricing-plan>

<!-- Alert message -->
<app-alert-popup
  *ngIf="isAlert"
  [alertMessage]="alertMessage"
></app-alert-popup>
