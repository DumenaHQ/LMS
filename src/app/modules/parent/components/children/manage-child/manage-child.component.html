<section class="ds-head dis-flex">
  <h2 class="ds-head_title clickable" routerLink="/parent/children">
    Children
  </h2>
  <i class="bx bx-chevron-right icon"></i>
  <p class="clickable">{{ child?.fullname }}</p>
</section>

<section class="ds-flex">
  <main class="ds-grid">
    <div class="welcome dis-flex">
      <div class="welcome_details dis-flex">
        <img [src]="child?.avatar" alt="" />
        <div class="">
          <h3>{{ child?.fullname }}</h3>
          <p>{{ child?.username }}</p>
        </div>
      </div>

      <div class="welcome_btns">
        <button class="btn tert_btn" routerLink="edit-child">
          Update Profile
        </button>
        <a class="remove clickable" (click)="openDeleteModal()">Remove Child</a>
      </div>
    </div>
    <!-- Learning overview(lo) -->
    <div class="lo">
      <div class="ds-sect-header">
        <h5>Learning Overview</h5>
      </div>
      <div class="chart">
        <img
          src="../../../../../../assets/img/learner/NBcharts-lineChats.svg"
          alt=""
        />
      </div>
    </div>
  </main>

  <aside class="ds-grid">
    <!-- Upgrade plan starts -->
    <div class="upgrade-plan dis-flex">
      <div class="left">
        <h4>Subscription</h4>
        <p>Standard Plan</p>
      </div>
      <button class="btn" (click)="openSelectPlanModal()">Upgrade</button>
    </div>
    <!-- Upgrade plan ends -->
    <!-- Learning quadrant(lq) -->
    <div class="lq">
      <div class="ds-sect-header dis-flex">
        <h5>Learning Quadrant</h5>
        <p class="caption-regular text-primary-color clickable">See Details</p>
      </div>
      <div class="chart">
        <img
          src="../../../../../../assets/img/learner/learning-quadrant-chart.svg"
          alt=""
        />
      </div>
    </div>

    <!-- Badges -->
    <div class="badges">
      <div class="ds-sect-header dis-flex">
        <h5>Badges</h5>
      </div>
      <div class="badges_body">
        <img
          src="../../../../../../assets/img/learner/coming-soon.svg"
          alt=""
        />
        <h3 class="text-primary-color">Coming soon</h3>
      </div>
    </div>
  </aside>
</section>

<!-- Delete confirmation -->
<div class="modal confirm-delete-modal" *ngIf="deleteModal">
  <div class="modal_area">
    <h5></h5>

    <div class="modal-details" style="text-align: left">
      <h2 class="text-primary-color">Delete Child</h2>
      <p>
        Are you sure you want to remove
        <strong class="text-primary-color">{{ child?.username }}</strong
        >?
      </p>
    </div>
    <!-- Buttons -->
    <div class="modal-btns dis-flex">
      <button type="button" class="btn skip_btn" (click)="closeDeleteModal()">
        Cancel
      </button>
      <button class="btn prim_btn" (click)="removeChild()">Remove</button>
    </div>
  </div>
</div>

<!-- Subscription plan -->
<app-pricing-plan
  *ngIf="selectPlanModal"
  (selectPlanModal)="closeSelectPlanModal()"
  [childData]="child"
  (isAlert)="showAlert()"
  (alertMessaage)="setAlertMessage($event)"
></app-pricing-plan>

<!-- Alert message -->
<app-alert-popup
  *ngIf="isAlert"
  [alertMessage]="alertMessage"
></app-alert-popup>
