<div class="modal">
  <div class="modal_area">
    <span class="modal_area_close" (click)="closeAddLearnerModal()">
      <i class="bx bx-x icon clickable"></i>
    </span>

    <div class="enroll auth_content">
      <h4 class="text-primary-color enroll_title">
        <span *ngIf="billingId == 'single'">Enroll a student</span>
        <span *ngIf="billingId == 'batch'">Enroll students</span>
      </h4>
      <form class="enroll_form auth_content_form" [formGroup]="formGroup">
        <!-- Tabs starts -->
        <div class="form-field col-2">
          <label for="">Select an enrollment method</label>
          <!-- enroll-mtd tabs -->
          <div class="enroll-mtd_tab">
            <div class="enroll-mtd_tab_wrapper">
              <span class="tab" [class.active]="billingId == 'single'" (click)="tabChange('single')">Single enrollment
              </span>
              <span class="tab" [class.active]="billingId == 'batch'" (click)="tabChange('batch')">Batch enrollment
              </span>
            </div>
          </div>
        </div>
        <!-- Tabs ends -->

        <!-- Single enrollment starts *ngIf="billingId == 'single'" -->
        <div class="single-enroll col-2" *ngIf="billingId == 'single'">
          <div class="form-field col-2" [ngClass]="{
              'is-invalid': formGroup.controls.fullname.errors && formGroup.controls.fullname.touched
            }">
            <label for="fullname">Full Name</label>
            <div class="input-field">
              <input type="text" id="fullname" name="fullname" formControlName="fullname" />
              <i class="bx bx-error-circle icon info-icon"></i>
            </div>

            <!-- Error -->
            <div *ngIf="formGroup.controls.fullname.errors && formGroup.controls.fullname.touched">
              <p class="body-3-regular error-msg">{{ getErrorMessage('fullname', 'Fullname') }}</p>
            </div>
          </div>
          <div
            class="form-field" [ngClass]="{
              'is-invalid': formGroup.controls.parent_email.errors && formGroup.controls.parent_email.touched
            }"
          >
            <label for="parent_email">Parent Email</label>
            <div class="input-field">
              <input
                type="email"
                id="parent_email"
                name="parent_email"
                formControlName="parent_email"
              />
            </div>
            <div *ngIf="formGroup.controls.parent_email.errors && formGroup.controls.parent_email.touched">
              <p class="body-3-regular error-msg">{{ getErrorMessage('parent_email', 'Parent Email') }}</p>
            </div>
          </div>
          <div class="form-field" [ngClass]="{
              'is-invalid': formGroup.controls.grade.errors && formGroup.controls.grade.touched
            }">
            <label for="grade">Grade</label>
            <div class="input-field">
              <input type="text" id="grade" name="grade" formControlName="grade" />
              <i class="bx bx-error-circle icon info-icon"></i>
            </div>

            <!-- Error -->
            <div *ngIf="formGroup.controls.grade.errors && formGroup.controls.grade.touched">
              <p class="body-3-regular error-msg">{{ getErrorMessage('grade', 'Grade') }}</p>
            </div>
          </div>
          <!-- Submit Button -->
          <div class="form-btns col-2 dis-flex">
            <span class="grey_btn clickable" (click)="closeAddLearnerModal()">Cancel</span>
            <div class="continue">
              <button class="btn prim_btn clickable" [disabled]="loading || formGroup.invalid" (click)="addLearners('single')">
                <span *ngIf="!loading">Continue</span>
                <span *ngIf="loading">Processing...</span>
              </button>
            </div>
          </div>
        </div>
        <!-- Single enrollment ends -->

        <!-- Batch enrollment starts *ngIf="billingId == 'batch'" -->
        <div class="batch-enroll col-2" *ngIf="billingId == 'batch'">
          <div class="form-field col-2">
            <label for="">
              Your can put your pupils' data in an excel sheet and upload to have them signed up all at
              once.
              <br />
              Or download the excel template to use from
              <strong>
                <a 
                  href="https://dev.dumena.com/downloads/template?name=students_template"
                  class="text-primary-color hover-1 clicakble"
                >here</a>
              </strong>
            </label>
            <div class="form-field select-image clickable" (click)="fileInput.click()" appDragDrop
              (fileDropped)="uploadFile($event)">
              <input type="file" #fileInput hidden accept=".xlsx" (change)="uploadFile($event)" />
              <p>{{ selectedFileName }}</p>
              <p class="body-3-regular">
                Select your file here 
                <!-- or <span class="text-primary-color">browse</span> -->
              </p>
              <p class="body-3-regular">Max file size 4MB</p>
            </div>
          </div>
          <!-- Submit Button -->
          <div class="form-btns col-2 dis-flex">
            <span class="grey_btn clickable" (click)="closeAddLearnerModal()">Cancel</span>
            <div class="continue">
              <button class="btn prim_btn clickable" [disabled]="loading || learnersList.length === 0"
                (click)="addLearners('fileUpload')">
                <span *ngIf="!loading">Continue</span>
                <span *ngIf="loading">Processing...</span>
              </button>
            </div>
          </div>
        </div>
        <!-- Batch enrollment ends -->
      </form>
    </div>
  </div>
</div>
