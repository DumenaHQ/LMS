<section class="ds-head">
  <h2 class="ds-head_title">Dashboard</h2>
</section>

<section class="overview">
  <main class="stats">
    <div class="card">
      <div class="card_item dis-flex">
        <span class="icon dis-flex">
          <img src="../../../../../assets/img/svg/profile-2user.svg" alt="" />
        </span>
        <div class="card_item_details">
          <h5 class="title">Students</h5>
          <h2 class="value">{{ students?.length }}</h2>
        </div>
      </div>
      <div class="card_item dis-flex">
        <span class="icon dis-flex">
          <img src="../../../../../assets/img/svg/box.svg" alt="" />
        </span>
        <div class="card_item_details">
          <h5 class="title">Classrooms</h5>
          <h2 class="value">{{ classrooms?.length }}</h2>
        </div>
      </div>
      <div class="card_item dis-flex">
        <span class="icon dis-flex">
          <img src="../../../../../assets/img/svg/video-square.svg" alt="" />
        </span>
        <div class="card_item_details">
          <h5 class="title">Teachers</h5>
          <h2 class="value">{{ teachers?.length }}</h2>
        </div>
      </div>
    </div>
    <div class="enroll">
      <div class="enroll_title">
        <h5>Enrollment</h5>
      </div>
      <!-- <div class="">
        <img src="../../../../../assets/img/svg/chart.svg" alt="" />
      </div> -->
      <div class="chart-container">
        <div class="chart" id="chart_div" style="width: 100%;"></div>
      </div>
    </div>
  </main>
