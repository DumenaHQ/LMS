<section class="ds-head">
  <h2 class="ds-head_title">Students</h2>
</section>

<section class="children">
  <div class="children_body">
    <ng-container>
      <section class="grouping dis-flex">
        <!-- Filter -->
        <div class="filter s-f">
          <div class="body-3-regular dis-flex">
            <span class="title">Filter:</span>
            <span class="dropdown dis-flex clickable"
              >All Students <i class="bx bx-chevron-down"></i
            ></span>
          </div>
        </div>

        <div class="right dis-flex">
          <!-- Sort -->
          <div class="sort s-f">
            <div class="body-3-regular dis-flex">
              <span class="title">Sort:</span>
              <span class="dropdown dis-flex clickable"
                >Last viewed <i class="bx bx-chevron-down"></i
              ></span>
            </div>
          </div>
          <!-- New Course Button -->
          <button class="btn prim_btn" (click)="openAddModal()">
            New Student
          </button>
        </div>
      </section>

      <section class="all-students">
        <app-school-display-students></app-school-display-students>
      </section>
    </ng-container>

    <!-- Course Blank -->
    <ng-template #noItems>
      <app-student-blank (addModal)="openAddModal()"></app-student-blank>
    </ng-template>
  </div>

  <!-- Alert Message -->
  <div class="alert-msg" [class.show]="showAlert">
    <div class="alert-msg_content">
      <p>You have enrolled a child successfully</p>
    </div>
  </div>
</section>

<div class="modal" [class.show-modal]="addModal">
  <div class="modal_area">
    <span class="modal_area_close" (click)="closeAddModal()">
      <i class="bx bx-x icon clickable"></i>
    </span>
    <app-enroll-learner
      (addModal)="closeAddModal()"
      (showAlert)="showAlertPopup()"
      [title]="title"
    ></app-enroll-learner>
  </div>
</div>
