<app-school-enroll-learners
  *ngIf="addLearnerModal"
  (addLearnerModal)="closeAddLearnerModal()"
></app-school-enroll-learners>

<section class="ds-head">
  <h2 class="ds-head_title">Students</h2>
</section>

<section class="children">
  <div class="children_body">
    <!-- Loader -->
    <app-loader *ngIf="dataLoading"></app-loader>

    <ng-container *ngIf="students?.length > 0">
      <section class="grouping dis-flex">
        <!-- Filter -->
        <div class="filter s-f">
          <div class="body-3-regular dis-flex">
            <span class="title">Filter:</span>
            <span class="dropdown-btn dis-flex clickable"
              >All Students <i class="bx bx-chevron-down"></i
            ></span>
          </div>
          <!-- <div class="dropdown">
            <p class="clickable">Hello</p>
          </div> -->
        </div>

        <div class="right dis-flex">
          <!-- Sort -->
          <div class="sort s-f">
            <div class="body-3-regular dis-flex">
              <span class="title">Sort:</span>
              <span class="dropdown-btn dis-flex clickable"
                >Last viewed <i class="bx bx-chevron-down"></i
              ></span>
            </div>
          </div>
          <!-- New Course Button -->
          <button class="btn prim_btn" (click)="openAddLearnerModal()">
            New Student
          </button>
        </div>
      </section>

      <section class="all-students">
        <app-school-display-students
          [students]="students"
        ></app-school-display-students>
      </section>
    </ng-container>

    <!-- Course Blank -->
    <ng-container *ngIf="students?.length === 0">
      <app-student-blank
        (addLearnerModal)="openAddLearnerModal()"
      ></app-student-blank>
    </ng-container>
  </div>
</section>
