<div class="courses_dislist" style="overflow-x: auto">
  <table>
    <tr class="table-header">
      <th>Name</th>
      <th>Contact Info</th>
      <th>Grade</th>
      <th>Date Enrolled</th>
      <th></th>
    </tr>
    <tr class="table-body clickable" *ngFor="let student of students">
      <td class="name">
        <div class="dis-flex">
          <img
            src="../../../../../../assets/img/children-avatar/child-avatar-1.png"
            alt=""
          />
          <div>
            <p>{{ student.fullname | titlecase }}</p>
            <p>{{ student.username | titlecase }}</p>
          </div>
        </div>
      </td>
      <td class="contact-info">
        <p>{{ student.email | titlecase }}</p>
        <p>{{ student.phone }}</p>
      </td>
      <td class="grade">
        <p>{{ student.grade }}</p>
      </td>
      <td class="dateEnrolled">
        <p>{{ student.createdAt | date: "mediumDate" }}</p>
      </td>
      <td class="actions">
        <img src="../../../../../../assets/img/action.svg" alt="" />
      </td>
    </tr>
  </table>
</div>
