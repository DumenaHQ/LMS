<section class="grouping dis-flex">
  <!-- Filter -->
  <div class="filter s-f">
    <div class="body-3-regular dis-flex">
      <span class="title">Filter:</span>
      <select [(ngModel)]="selectedGrade" (change)="getAllStudents()" class="s-f-select grade-select" style="border: none; outline: none; background-color: transparent;">
        <option value="">All Grades</option>
        <option [value]="grade.id" *ngFor="let grade of grades">{{ grade.name }}</option>
      </select>
    </div>
  </div>

  <div class="right dis-flex">
    <!-- Sort -->
    <div class="sort s-f">
      <div class="body-3-regular dis-flex">
        <span class="title">Sort:</span>
        <span class="dropdown-btn dis-flex clickable"
          >Last viewed <i class="bx bx-chevron-down"></i
        ></span>
      </div>
    </div>
    <!-- New Course Button -->
    <button class="btn prim_btn" (click)="openAddLearnerModal()">
      New Student
    </button>
  </div>
</section>

<div class="courses_dislist" style="overflow-x: auto">
  <div class="courses_dislist_password dis-flex">
    <h5 class="body-2-bold">Default Password:</h5>
    <p class="body-3-regular text-secondary-color"><i>dumena</i></p>
  </div>
  <table>
    <tr class="table-header">
      <th>Name</th>
      <th>Parent Email</th>
      <th>Username</th>
      <th>Date Enrolled</th>
      <th></th>
    </tr>
    <ng-container *ngIf="students?.length > 0">
      <tr class="table-body" *ngFor="let student of students">
        <td class="name">
          <div class="dis-flex">
            <img
              src="../../../../../../assets/img/children-avatar/child-avatar-1.png"
              alt=""
            />
            <div>
              <p>{{ student.fullname }}</p>
              <p>Grade: {{ student.grade }}</p>
            </div>
          </div>
        </td>
        <td class="contact-info">
          <p>{{ (student.parent_email | titlecase) || "-" }}</p>
          <!-- <p>{{ student.phone }}</p> -->
        </td>
        <td class="grade">
          <p>{{ student.username }}</p>
        </td>
        <td class="dateEnrolled">
          <p>{{ student.createdAt | date: "mediumDate" }}</p>
        </td>
        <td class="actions">
          <img src="../../../../../../assets/img/action.svg" alt="" class="clickable" (click)="actionBtn.click()" />
          <input
              type="checkbox"
              name="action-btn"
              id="action-btn"
              style="display: none"
              #actionBtn
            />
            <div class="dropdown">
              <small
                class="body-3-regular delete clickable"
                (click)="openDeleteModal(student)"
                >Delete</small
              >
            </div>
        </td>
      </tr>
    </ng-container>
  </table>
  <div style="text-align: center; padding: 1rem;" *ngIf="students?.length === 0">
    <span>No Students found</span>
  </div>
</div>

<!-- Delete confirmation -->
<app-confirm-delete *ngIf="deleteModal" (deleteModal)="closeDeleteModal()" [itemName]="studentName" [deleteUrl]="deleteUrl" [deleteRoutePath]="deleteRoutePath"></app-confirm-delete>
