<section class="ds-head">
  <h2 class="ds-head_title">Payments</h2>
</section>

<section></section>

<section class="pricing">
  <div class="pricing_header dis-flex">
    <button class="btn prim_btn">Make Payment</button>
  </div>
</section>

<!-- Payment History(PH) -->
<section class="ph">
  <div class="ds-sect-header dis-flex">
    <h5>Payment History</h5>
  </div>
  <div class="ph_body">
    <div style="overflow-x: auto">
      <table>
        <tr class="table-header">
          <th>Channel</th>
          <th>Amount (NGN)</th>
          <th>Date</th>
          <th>Status</th>
        </tr>
        <ng-container>
          <tr class="table-body" *ngFor="let i of paymentsHistory">
            <td>{{ i.channel | titlecase }}</td>
            <td>{{ i.amount / 100 | number }}</td>
            <td>{{ i.createdAt | date: "medium" }}</td>
            <td class="status">
              <button
                type="button"
                [class.success_btn]="i.status == 'success'"
                [class.warning_btn]="i.status == 'pending'"
                [class.danger_btn]="i.status == 'declined'"
              >
                {{ i.status | titlecase }}
              </button>
            </td>
          </tr>
        </ng-container>
        <ng-template>
          <p style="text-align: center">Empty Payment History!</p>
        </ng-template>
      </table>
    </div>
  </div>
</section>
