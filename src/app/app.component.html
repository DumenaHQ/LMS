<router-outlet></router-outlet>
<!-- Back to top -->
<a
  class="go-top clickable"
  (click)="scrollToTop()"
  [ngClass]="{ show: windowScrolled }"
>
  <i class="bx bx-chevron-up icon"></i>
</a>

<!-- Alert message -->
<app-alert-popup
  *ngIf="alertShowing"
  [alertMessage]="alertMessage"
  [alertColor]="alertType"
></app-alert-popup>
