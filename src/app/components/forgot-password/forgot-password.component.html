<div class="auth login">
  <div class="auth_content">
    <!-- Logo -->
    <span class="auth_content_logo clickable" routerLink="/">
      <img src="../../../assets/img/logo.svg" alt="" />
    </span>
    <div class="auth_border" *ngIf="id == 'forgot-password'">
      <div class="auth_content_header center">
        <h3 class="title">Forgot Password?</h3>
        <p>
          Don’t worry, it happens to the best of us! We’ll email you a password
          reset link.
        </p>
      </div>
      <form
        class="auth_content_form"
        [formGroup]="formGroup"
      >
        <div class="form-field col-2" [ngClass]="{
          'is-invalid':formGroup.controls.email.errors && formGroup.controls.email.touched
        }">
          <label for="email">Email Address</label>
          <div class="input-field">
            <input type="email" name="email" formControlName="email" />
            <i class="bx bx-error-circle icon info-icon"></i>
          </div>
          <!-- Error -->
          <div *ngIf="formGroup.controls.email.errors && formGroup.controls.email.touched">
            <p class="body-3-regular error-msg">{{ getErrorMessage('email', 'Email') }}</p>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="form-btn col-2">
          <button class="btn prim_btn clickable" [disabled]="loading" (click)="sendResetEmail()">
            <span *ngIf="!loading">Send link to email</span>
            <span *ngIf="loading">Processing...</span>
          </button>
        </div>
      </form>
      <div class="auth_content_extra">
        <p class="login">
          <span
            class="text-primary-color body-1-bold clickable"
            routerLink="/login"
            >Back to Login</span
          >
        </p>
      </div>
    </div>

    <!-- Check Mail -->
    <app-check-mail *ngIf="id == 'check-mail'" [email]="email"></app-check-mail>
  </div>
</div>
