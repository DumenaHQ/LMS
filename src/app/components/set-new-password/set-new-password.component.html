<div class="auth login">
  <div class="auth_content">
    <!-- Logo -->
    <span class="auth_content_logo clickable" routerLink="/">
      <img src="../../../assets/img/logo.svg" alt="" />
    </span>

    <!-- Set new password -->
    <div class="auth_border" *ngIf="id == 'set-new-password'">
      <div class="auth_content_header center">
        <h3 class="title">Set new password</h3>

      </div>
      <form class="auth_content_form" [formGroup]="formGroup">
        <div class="form-field col-2" [ngClass]="{
          'is-invalid': formGroup.controls.password.errors && formGroup.controls.password.touched
        }">
          <label for="password">New Password</label>
          <div class="input-field">
            <input type="password" name="password" [type]="hide ? 'password' : 'text'" formControlName="password" />
            <i [class]="
                hide ? 'bx bx-show clickable icon' : 'bx bx-hide clickable icon'
              " (click)="hide = !hide"></i>
          </div>
          <!-- Error -->
          <div *ngIf="formGroup.controls.password.errors && formGroup.controls.password.touched">
            <p class="body-3-regular error-msg">{{ getErrorMessage('password', 'Password') }}</p>
          </div>
        </div>
        
        <!-- Submit Button -->
        <div class="form-btn col-2">
          <button class="btn prim_btn clickable" [disabled]="loading" (click)="resetNewPassword()">
            <span *ngIf="!loading">Save password</span>
            <span *ngIf="loading">Processing...</span>
          </button>
        </div>
      </form>
      <div class="auth_content_extra">
        <p class="login">
          <span class="text-primary-color body-1-bold clickable" routerLink="/login">Back to Login</span>
        </p>
      </div>
    </div>

    <!-- Password Reset -->
    <app-password-reset *ngIf="id == 'reset-successful'"></app-password-reset>
  </div>
</div>
